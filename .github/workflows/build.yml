name: Build APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the Android SDK; just make sure platform 35 is there
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets; the APK is signed with a throwaway debug key and won't update an installed copy."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION_NAME="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION_NAME="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then VERSION_NAME="$VERSION_NAME-dev.$GITHUB_RUN_NUMBER"; fi
          export VERSION_NAME
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          gradle assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "HomeTranslate-${VERSION_NAME}.apk"
          ls -l HomeTranslate-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HomeTranslate-apk
          path: HomeTranslate-*.apk

      # Publish a release for a pushed v* tag, or when VERSION on main names a version not released yet
      - name: Publish GitHub release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; bump VERSION to publish a new one."
          else
            gh release create "$tag" HomeTranslate-*.apk --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
